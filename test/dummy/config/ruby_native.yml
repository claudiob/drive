# Read by the native app on launch, and rendered as ERB first — so the tab bar and
# the entry point follow config/routes.rb rather than repeating it. JSON is valid
# YAML, which is how a computed list of tabs fits on one line.
app:
  # Native screen transitions and a native navigation bar, in place of web
  # navigation. The layout hides its own navbar and sidebar to make room.
  mode: advanced
  entry_path: <%= Recourse.entry_path %>

tabs: <%= Recourse.tabs.to_json %>

# The native app requires this block even though every key in it has a default.
appearance:
  theme: auto
