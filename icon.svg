<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' role='img' aria-labelledby='icon-title'>
<title id='icon-title'>recourse: a signal-red circuit loop crossing its start line, on an asphalt tile.</title>
<!--
  The same loop the page draws in its hero, redrawn for the sizes a tab and a home screen
  actually get. The hero can afford a 16-unit stroke on a 240 canvas; a 16-pixel tab cannot,
  so here the loop is drawn heavier against its own width and the two start-line ticks are
  heavier still — at the hero's proportions they fall under half a pixel and grey out. The
  shape, the 16-degree lean and the upright ticks are the hero's, unchanged. Set `rx` to 0
  for the Apple touch icon and the avatar — iOS applies its own mask, every avatar is shown
  round, and a corner rounded twice reads as a mistake.
-->
<defs>
  <linearGradient id='tile' x1='0' y1='0' x2='0.45' y2='1'>
    <stop offset='0%' stop-color='#22242B'/>
    <stop offset='100%' stop-color='#0C0D0F'/>
  </linearGradient>
</defs>
<rect width='64' height='64' rx='14' fill='url(#tile)'/>
<g transform='translate(-4.94 -4.63) scale(0.3028)' fill='none' stroke='#FF3B1F' stroke-linejoin='round'>
  <path d='M 77.6 198.0 C 35.6 198.0 40.8 152.0 77.4 136.0 C 102.6 125.0 108.9 103.0 86.6 90.0
           C 64.3 77.0 84.4 42.0 118.4 42.0 L 170.4 42.0 C 204.4 42.0 203.2 74.0 175.7 86.0
           C 152.9 96.0 146.6 118.0 165.7 128.0 C 190.0 141.0 169.4 192.0 128.2 196.0 Z'
        stroke-width='20'/>
  <path d='M 94 180 V 216 M 109 180 V 216' stroke-width='9'/>
</g>
</svg>
